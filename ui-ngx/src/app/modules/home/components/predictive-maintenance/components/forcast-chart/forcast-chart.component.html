<div class="container">
  <apx-chart [series]="series" [chart]="chart" class="chart" [title]="title" [fill]="fill" [yaxis]="yaxis"
    [xaxis]="xaxis" [tooltip]="tooltip" [dataLabels]="dataLabels" [markers]="markers" [legend]="legend"
    [stroke]="stroke"></apx-chart>
  <div class="history-container">
    <mat-form-field class="history">
      <mat-label>History</mat-label>
      <mat-select (selectionChange)="onSelectTimeChange($event)" [(value)]="selected.value">
        <mat-option *ngFor="let option of selectionOptions" [(value)]="option.value">{{ option.name }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
</div>
