<div class="tb-forecast-page mat-content">
    <section class="tb-forecast-toolbar mat-elevation-z1">
        <mat-toolbar class="tb-forecast-toolbar-content">
            <div class="tb-forecast-toolbar-wrapper">
                <div class="tb-forecast-action-panels">
                    <div class="tb-forecast-action-panel tb-left-panel">
                        <div class="forecast-title">
                            <h3>Your Models</h3>
                        </div>
                    </div>
                    <div class="tb-forecast-action-panel tb-right-panel">
                        <!-- Search functionality -->
                        <div *ngIf="textSearchMode" class="search-container">
                            <mat-form-field appearance="outline" class="search-field">
                                <mat-label>Search...</mat-label>
                                <input #searchInput matInput [formControl]="textSearch" (keyup)="applyFilter($event)" />
                            </mat-form-field>
                            <button mat-icon-button (click)="exitFilterMode()" matTooltip="Close"
                                matTooltipPosition="above">
                                <mat-icon>close</mat-icon>
                            </button>
                        </div>

                        <!-- Normal mode buttons -->
                        <div *ngIf="!textSearchMode" class="toolbar-actions">
                            <!-- Refresh button -->
                            <button mat-icon-button (click)="refreshForecasts()" matTooltip="Refresh"
                                matTooltipPosition="below" [disabled]="isLoading">
                                <mat-icon>refresh</mat-icon>
                            </button>

                            <!-- <button mat-icon-button (click)="enterFilterMode()" matTooltip="Search"
                                matTooltipPosition="below">
                                <mat-icon>search</mat-icon>
                            </button> -->

                            <!-- Column visibility selector -->
                            <button mat-icon-button [matMenuTriggerFor]="columnsMenu" matTooltip="Show/Hide Columns"
                                matTooltipPosition="below">
                                <mat-icon>view_column</mat-icon>
                            </button>
                            <mat-menu #columnsMenu="matMenu" class="column-menu">
                                <div mat-menu-item *ngFor="let column of toggleableColumns"
                                    (click)="toggleColumnVisibility(column.key); $event.stopPropagation()">
                                    <mat-checkbox [checked]="column.visible" (click)="$event.stopPropagation()"
                                        (change)="toggleColumnVisibility(column.key)">
                                        {{ column.name }}
                                    </mat-checkbox>
                                </div>
                            </mat-menu>

                            <button mat-icon-button color="primary" (click)="openAddForecastDialog()"
                                matTooltip="Create Model" matTooltipPosition="below">
                                <mat-icon>add</mat-icon>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </mat-toolbar>
    </section>

    <mat-card class="forecast-content-card">
        <div class="container">

            <!-- Table container to stretch the table to full page height -->
            <div class="table-container">
                <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

                    <ng-container matColumnDef="id">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
                        <td mat-cell *matCellDef="let element">{{ element.id }}</td>
                    </ng-container>

                    <ng-container matColumnDef="modelName">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
                        <td mat-cell *matCellDef="let element">{{ element.modelName || 'N/A' }}</td>
                    </ng-container>

                    <ng-container matColumnDef="device">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header>Device</th>
                        <td mat-cell *matCellDef="let element">{{ element.device }}</td>
                    </ng-container>

                    <ng-container matColumnDef="attributes">
                        <th mat-header-cell *matHeaderCellDef>Attributes</th>
                        <td mat-cell *matCellDef="let element" class="attributes-cell">
                            <span class="attributes-text" [matTooltip]="element.attributesText || 'No attributes'"
                                matTooltipPosition="above" [matTooltipDisabled]="!element.attributesText">
                                {{ element.attributesText || 'No attributes' }}
                            </span>
                        </td>
                    </ng-container>

                    <!-- <ng-container matColumnDef="user">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>User</th>
              <td mat-cell *matCellDef="let element">{{ element.user }}</td>
          </ng-container> -->

                    <ng-container matColumnDef="date">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header>Creation Time</th>
                        <td mat-cell *matCellDef="let element">{{ element.date | date }}</td>
                    </ng-container>

                    <ng-container matColumnDef="status">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
                        <td mat-cell *matCellDef="let element">
                            <span class="forecast-status" [ngClass]="getForecastStatusClass(element.status)">
                                {{ getForecastStatusDisplayText(element.status) }}
                            </span>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="action">
                        <th mat-header-cell *matHeaderCellDef>
                        </th>
                        <td mat-cell *matCellDef="let element">
                            <div class="action-buttons">
                                <button mat-icon-button color="primary" aria-label="Edit"
                                    (click)="editForecast($event, element)">
                                    <mat-icon>edit</mat-icon>
                                </button>
                                <button mat-icon-button color="warn" aria-label="Delete"
                                    (click)="confirmDeleteForecast($event, element)">
                                    <mat-icon>delete</mat-icon>
                                </button>
                            </div>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="openForecastModel(row)"
                        class="row-model"></tr>
                </table>
            </div>

            <!-- Pagination to always stay at the bottom -->
            <mat-paginator [pageSizeOptions]="pageSizeOptions" [length]="totalElements" showFirstLastButtons
                [pageSize]="10"></mat-paginator>
        </div>
